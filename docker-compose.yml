services:
  postgres:
    image: postgres:16-alpine
    container_name: jk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jk
      POSTGRES_PASSWORD: jk
      POSTGRES_DB: jk_empreendimentos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jk -d jk_empreendimentos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
